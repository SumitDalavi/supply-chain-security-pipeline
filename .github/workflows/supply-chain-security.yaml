name: Supply Chain Security Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/sumitdalavi/secure-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # ─── Stage 1: SBOM Generation ───────────────────────────────────────
  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX)
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o spdx-json=sbom-spdx.json \
            -o cyclonedx-json=sbom-cyclonedx.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json

  # ─── Stage 2: Vulnerability Scanning ────────────────────────────────
  vulnerability-scan:
    name: Scan for Vulnerabilities
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-reports

      - name: Scan with Grype (SBOM-based)
        uses: anchore/scan-action@v3
        with:
          sbom: sbom-spdx.json
          fail-build: true
          severity-cutoff: critical

      - name: Scan with Trivy (Image-based)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # ─── Stage 3: Image Signing (cosign / Sigstore) ─────────────────────
  sign:
    name: Sign Container Image
    needs: [build, vulnerability-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for keyless signing via Fulcio
      packages: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Image (Keyless via Sigstore)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  # ─── Stage 4: SLSA Provenance Attestation ───────────────────────────
  provenance:
    name: Generate SLSA Provenance
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SLSA Provenance
        run: |
          cosign attest --yes \
            --predicate - \
            --type slsaprovenance \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} <<EOF
          {
            "buildType": "https://github.com/actions/runner",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@refs/heads/${{ github.ref_name }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            }
          }
          EOF

  # ─── Stage 5: OPA Policy Gate ───────────────────────────────────────
  policy-gate:
    name: OPA Policy Check
    needs: [vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa && sudo mv opa /usr/local/bin/

      - name: Run Policy Checks
        run: |
          echo '{"critical_cves": 0, "image_signed": true, "sbom_exists": true}' > input.json
          opa eval -i input.json -d policies/opa/ "data.supplychain.allow" --fail-defined
