name: Supply Chain Security Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: ghcr.io/sumitdalavi/supply-chain-security-pipeline
  IMAGE_TAG:  ${{ github.sha }}

jobs:
  # ── 1. Build & Push Container Image ─────────────────────────────────────────
  build:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }},${{ env.IMAGE_NAME }}:latest

  # ── 2. SBOM Generation ───────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o spdx-json=sbom.spdx.json
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o cyclonedx-json=sbom.cyclonedx.json
          echo "SBOM generated:"
          cat sbom.spdx.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Packages: {len(d.get("packages",[]))}')"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.*.json
          retention-days: 90

  # ── 3. Vulnerability Scanning ────────────────────────────────────────────────
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif

      - name: Check no CRITICAL CVEs
        run: |
          CRITICAL=$(cat grype-results.sarif | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          crits=[r for r in d.get('runs',[{}])[0].get('results',[])
                 if r.get('level') == 'error']
          print(len(crits))
          ")
          echo "Critical CVEs: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "FAIL: $CRITICAL critical CVEs found. See Security tab for details."
            exit 1
          fi
