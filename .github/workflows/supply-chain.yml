name: Supply Chain Security Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG:  ${{ github.sha }}

jobs:
  # ── 1. Build & Push Container Image ─────────────────────────────────────────
  build:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }},${{ env.IMAGE_NAME }}:latest
          provenance: true
          sbom: true

  # ── 2. SBOM Generation ───────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX + CycloneDX)
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o spdx-json=sbom.spdx.json
          syft ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o cyclonedx-json=sbom.cyclonedx.json
          echo "SBOM generated:"
          cat sbom.spdx.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Packages: {len(d.get("packages",[]))}')"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.*.json
          retention-days: 90

  # ── 3. Vulnerability Scanning ────────────────────────────────────────────────
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Scan image with Grype
        id: grype
        uses: anchore/scan-action@v3
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif

      - name: Check no CRITICAL CVEs
        run: |
          CRITICAL=$(cat grype-results.sarif | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          crits=[r for r in d.get('runs',[{}])[0].get('results',[])
                 if r.get('level') == 'error']
          print(len(crits))
          ")
          echo "Critical CVEs: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "FAIL: $CRITICAL critical CVEs found. See Security tab for details."
            exit 1
          fi

  # ── 4. Image Signing with Cosign ─────────────────────────────────────────────
  sign:
    name: Sign Image
    runs-on: ubuntu-latest
    needs: [build, scan, sbom]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write  # for keyless signing via Sigstore
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless via Sigstore/Fulcio)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          echo "Image signed: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}"

      - name: Attach SBOM as attestation
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
        continue-on-error: true

  # ── 5. SLSA Provenance Verification ──────────────────────────────────────────
  verify:
    name: Verify Supply Chain
    runs-on: ubuntu-latest
    needs: sign
    if: github.event_name != 'pull_request'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          echo "Signature verification PASSED"

      - name: Summary
        run: |
          echo "## Supply Chain Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM (Syft) | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Vuln Scan (Grype) | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosign Signature | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Provenance Verify | PASS |" >> $GITHUB_STEP_SUMMARY
